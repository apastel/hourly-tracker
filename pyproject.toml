[project]
name = "hourly-tracker"
version = "2.0.0"
description = "Track a workday, splitting away time into idle and offline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Alex Pastel", email = "alex.r.pastel@gmail.com"},
]
dependencies = []

[project.scripts]
hourly-tracker = "hourly_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

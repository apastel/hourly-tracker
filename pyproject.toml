[project]
name = "hourly-tracker"
version = "2.0.0"
description = "Track a workday, splitting away time into idle and offline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Alex Pastel", email = "alex.r.pastel@gmail.com"},
]
dependencies = [
    "Pillow>=10.0",
    "pystray>=0.19",
    "winotify>=1.1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.13,<7",
]

[project.scripts]
hourly-tracker = "hourly_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hourly_tracker = ["assets/*.png"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

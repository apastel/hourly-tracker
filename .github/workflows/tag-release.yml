name: Tag and draft release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: New release tag (for example v2.1.0)
        required: true
        type: string
      target_branch:
        description: Branch commit to tag
        required: true
        default: main
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  tag-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_run_id: ${{ steps.build.outputs.run_id }}
    steps:
      - name: Create annotated tag
        id: tag
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        with:
          script: |
            const tagName = process.env.TAG_NAME.trim();
            const targetBranch = process.env.TARGET_BRANCH.trim();
            if (!/^v[0-9A-Za-z][0-9A-Za-z.-]*$/.test(tagName)) {
              core.setFailed("Use a release tag beginning with v, such as v2.1.0.");
              return;
            }
            if (!targetBranch || targetBranch.startsWith("-")) {
              core.setFailed("Enter a valid target branch.");
              return;
            }

            const { owner, repo } = context.repo;
            const target = await github.rest.git.getRef({
              owner, repo, ref: `heads/${targetBranch}`
            });
            const commitSha = target.data.object.sha;

            let existing;
            try {
              existing = await github.rest.git.getRef({
                owner, repo, ref: `tags/${tagName}`
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existing) {
              let object = existing.data.object;
              while (object.type === "tag") {
                object = (await github.rest.git.getTag({
                  owner, repo, tag_sha: object.sha
                })).data.object;
              }
              if (object.type !== "commit" || object.sha !== commitSha) {
                core.setFailed(`Tag ${tagName} already exists at a different commit.`);
                return;
              }
              core.info(`Reusing ${tagName} at ${commitSha}.`);
            } else {
              const annotatedTag = await github.rest.git.createTag({
                owner,
                repo,
                tag: tagName,
                message: `Release ${tagName}`,
                object: commitSha,
                type: "commit"
              });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tagName}`,
                sha: annotatedTag.data.sha
              });
              core.info(`Created ${tagName} at ${commitSha}.`);
            }
            core.setOutput("commit_sha", commitSha);

      - name: Dispatch installer build for tag
        id: dispatch
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        with:
          script: |
            const startedAt = new Date().toISOString();
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "build-installer.yml",
              ref: process.env.TAG_NAME.trim(),
              inputs: { source_ref: process.env.TAG_NAME.trim() }
            });
            core.setOutput("started_at", startedAt);

      - name: Wait for installer build
        id: build
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          COMMIT_SHA: ${{ steps.tag.outputs.commit_sha }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        timeout-minutes: 40
        with:
          script: |
            const deadline = Date.now() + 35 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: "build-installer.yml",
                event: "workflow_dispatch",
                per_page: 100
              });
              const run = data.workflow_runs.find(candidate =>
                candidate.head_sha === process.env.COMMIT_SHA &&
                candidate.created_at >= process.env.STARTED_AT &&
                candidate.display_title === `Build Windows installer (${process.env.TAG_NAME})`
              );

              if (run?.status === "completed") {
                if (run.conclusion !== "success") {
                  core.setFailed(`Installer build ${run.id} concluded ${run.conclusion}.`);
                  return;
                }
                core.setOutput("run_id", String(run.id));
                core.info(`Installer build ${run.id} succeeded.`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed("Timed out waiting for the installer build workflow.");

  draft-release:
    needs: tag-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: hourly-tracker-installer
          path: release-assets
          run-id: ${{ needs.tag-and-build.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Draft GitHub release with standalone installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          mapfile -t installers < <(find release-assets -maxdepth 1 -type f -name 'HourlyTracker-Setup-*.exe' -print)
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "Expected exactly one revision-named installer, found ${#installers[@]}."
            exit 1
          fi
          if previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)"; then
            commits="${previous_tag}..HEAD"
          else
            commits="HEAD"
          fi
          notes="$(git log --reverse --format='- %s (`%h`)' "$commits")"
          if [[ -z "$notes" ]]; then
            notes="No commits since the previous tag."
          fi
          gh release create "$TAG_NAME" "${installers[0]}" \
            --draft \
            --title "Hourly Tracker $TAG_NAME" \
            --notes "$notes"
